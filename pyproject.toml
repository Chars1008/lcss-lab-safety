[project]
name = "lcss-lab-safety"
version = "0.1.0"
description = "Laboratory Chemical Safety System (LCSS) - 實驗室藥品安全管理系統"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
    "PySide6>=6.7.0",
    "SQLAlchemy>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "rdkit>=2024.3.1",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "Jinja2>=3.1.0",
    "PyMuPDF>=1.24.0",
    "qrcode[pil]>=7.4.2",
    "python-barcode>=0.15.1",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
]

[project.scripts]
lcss = "main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
